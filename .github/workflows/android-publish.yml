name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.2.13)
        required: true
      source_commit:
        description: Exact application build commit
        required: true
      debug_run:
        description: Successful Android app workflow run ID
        required: true
      release_run:
        description: Successful Android signed release workflow run ID
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify both builds and publish the fixed-signature release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DEBUG_RUN: ${{ inputs.debug_run }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: python .github/scripts/publish-verified-release.py
