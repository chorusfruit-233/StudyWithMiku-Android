name: Android signed release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-signed-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Restore signing keystore from encrypted secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets.")
          key = Path(os.environ["RUNNER_TEMP"]) / "studywithmiku-release.jks"
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"path={key}\n")
          PY
      - name: Build, test and lint signed Release
        working-directory: android
        env:
          MIKU_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MIKU_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MIKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MIKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease testReleaseUnitTest lintRelease
      - name: Verify package, fixed certificate and release flags
        id: apk
        run: python .github/scripts/prepare-release.py android/app/build/outputs/apk/release/app-release.apk artifacts/release
      - name: Create release draft for review before public publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          zip -qr artifacts/release/Android-release-check-reports.zip android/app/build/reports android/app/build/test-results
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true" || { echo 'Version already published; increase versionName and versionCode.'; exit 1; }
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
            gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --target "$GITHUB_SHA" --draft=true \
              --title "Study With Miku Android $RELEASE_VERSION · Release" --notes-file .github/release-notes.md
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --draft --target "$GITHUB_SHA" \
              --title "Study With Miku Android $RELEASE_VERSION · Release" --notes-file .github/release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/studywithmiku-release.jks"
