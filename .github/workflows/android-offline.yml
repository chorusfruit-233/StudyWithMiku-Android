name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-offline.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-offline.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 15 interaction and persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: MIKU_DEVICE_API=35 bash .github/scripts/check-device-tests.sh
      - name: Run Android 17 interaction and persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: miku-api-37
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: MIKU_DEVICE_API=37 bash .github/scripts/check-device-tests.sh
      - name: Save verification reports even when device tests fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-verification-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Prepare APK artifact
        id: debug_apk
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../artifacts
          debug_version=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | python -c 'import re,sys; print(re.search(r"versionName=\x27([^\x27]+)\x27",sys.stdin.read()).group(1))')
          echo "version=$debug_version" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/StudyWithMiku-Android-$debug_version-debug-${GITHUB_SHA:0:7}.apk"
          cd ../artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Save Debug APK and reports to an unpublished release draft
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEBUG_VERSION: ${{ steps.debug_apk.outputs.version }}
        run: |
          zip -qr artifacts/Android-check-reports.zip android/app/build/reports android/app/build/test-results android/app/build/outputs/androidTest-results
          release_tag="ci-${GITHUB_SHA:0:12}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" artifacts/* --clobber
          else
            gh release create "$release_tag" artifacts/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "Android Debug APK $DEBUG_VERSION ${GITHUB_SHA:0:7}" \
              --notes-file .github/ci-release-notes.md
          fi
          gh release view "$release_tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
