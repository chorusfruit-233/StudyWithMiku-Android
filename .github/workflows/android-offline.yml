name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-offline.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-offline.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Prepare APK artifact
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../artifacts/StudyWithMiku-Android-1.1.0-${GITHUB_SHA:0:7}.apk"
          cd ../artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Save APK and reports to a private release draft
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip -qr artifacts/Android-check-reports.zip android/app/build/reports android/app/build/test-results
          release_tag="ci-${GITHUB_SHA:0:12}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" artifacts/* --clobber
          else
            gh release create "$release_tag" artifacts/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "Android APK 1.1.0 ${GITHUB_SHA:0:7}" \
              --notes-file .github/ci-release-notes.md
          fi
          gh release view "$release_tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
